<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TeacHub - 学科质量分析</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="assets/quality-analysis.css">
  </head>
  <body class="fill-page">
    <header class="fill-topbar quality-nav"><nav aria-label="TeacHub导航"><a class="back-link" href="index.html">TeacHub</a><span aria-hidden="true">/</span><a class="back-link" href="index.html?view=templates">模板填充</a><span aria-hidden="true">/</span><a class="back-link" href="index.html?view=templates#monthly-summaries">月度总结</a><span aria-hidden="true">/</span><span aria-current="page">学科质量分析</span></nav></header>
    <main class="quality-shell">
      <section class="fill-panel">
        <div class="quality-upload-head"><div class="fill-heading"><span class="tool-icon red" aria-hidden="true">析</span><div><h1>学科质量分析</h1></div></div><label>月份<input id="quality-month" type="month"></label></div>
        <label class="quality-upload" id="quality-drop-zone">
          <span class="quality-upload-icon" aria-hidden="true">↑</span>
          <strong>拖入班级数据文件</strong>
          <span>或点击选择 · XLSX</span>
          <input id="quality-files" type="file" accept=".xlsx" multiple aria-label="上传班级数据">
        </label>
        <div id="quality-file-list" class="quality-file-list" aria-live="polite" hidden></div>
        <div id="quality-status" class="quality-status" role="status" aria-live="polite" hidden></div>
      </section>
      <section id="quality-settings-panel" class="fill-panel" hidden>
        <h2>核对与修改成绩</h2>
        <div id="quality-settings"></div>
      </section>
      <section id="quality-preview-panel" class="fill-panel" hidden>
        <div class="editor-head"><h2>质量分析表</h2><div class="editor-actions"><button id="quality-copy" class="action secondary" type="button" disabled>复制数据</button><button id="quality-export" class="action" type="button" disabled>下载 Excel</button></div></div>
        <div class="quality-table-wrap"><table id="quality-report" class="quality-table">
          <thead>
            <tr><th rowspan="4">学科</th><th rowspan="4">教师</th><th rowspan="4">学生人数</th><th rowspan="4">参考人数</th><th colspan="6" rowspan="2">整体分析</th><th colspan="9">目标完成情况</th></tr>
            <tr>
              <th colspan="3" class="quality-threshold">优秀 <select data-threshold-operator="0" aria-label="优秀比较条件"><option value=">=">≥</option><option value=">">&gt;</option></select><input data-threshold="0" aria-label="优秀分数线" type="number" min="0" max="100" step="0.01" placeholder="分数线"></th>
              <th colspan="3" class="quality-threshold">良好 <select data-threshold-operator="1" aria-label="良好比较条件"><option value=">=">≥</option><option value=">">&gt;</option></select><input data-threshold="1" aria-label="良好分数线" type="number" min="0" max="100" step="0.01" placeholder="分数线"></th>
              <th colspan="3" class="quality-threshold">合格 <select data-threshold-operator="2" aria-label="合格比较条件"><option value=">=">≥</option><option value=">">&gt;</option></select><input data-threshold="2" aria-label="合格分数线" type="number" min="0" max="100" step="0.01" placeholder="分数线"></th>
            </tr>
            <tr><th rowspan="2">满分</th><th rowspan="2">最高分</th><th rowspan="2">最低分</th><th rowspan="2">平均分</th><th>上期</th><th>均分</th><th>达标</th><th rowspan="2">目标人数</th><th rowspan="2">完成率</th><th>达标</th><th rowspan="2">目标人数</th><th rowspan="2">完成率</th><th>达标</th><th rowspan="2">目标人数</th><th rowspan="2">完成率</th></tr>
            <tr><th>均分</th><th>变化</th><th>人数</th><th>人数</th><th>人数</th></tr>
          </thead><tbody id="quality-preview"></tbody>
        </table></div>
      </section>
    </main>
    <script src="vendor/jszip.min.js"></script>
    <script src="assets/quality-template.js"></script>
    <script src="assets/quality-analysis-core.js"></script>
    <script src="assets/quality-analysis.js"></script>
  </body>
</html>
